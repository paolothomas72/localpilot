[project]
name = "localpilot"
version = "0.1.0"
description = "Stay local unless the task needs the cloud. A visible seven-gate router for Ollama and llama.cpp."
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
localpilot = "localpilot.cli:main"

[tool.setuptools.packages.find]
include = ["localpilot"]

[tool.setuptools.package-data]
localpilot = ["*.tcss"]

