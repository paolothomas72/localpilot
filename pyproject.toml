[project]
name = "localpilot"
version = "0.1.0"
description = "Local-first model routing benchmark and CLI"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
localpilot = "localpilot.cli:main"

[tool.setuptools.packages.find]
include = ["localpilot"]

[tool.setuptools.package-data]
localpilot = ["*.tcss"]

